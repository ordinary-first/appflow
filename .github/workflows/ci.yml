name: CI

# Regression net: typecheck + the vitest truthiness suite on every push/PR.
# Keeps the local-only safety net (signal-authority, anon-crypto, toggle tests)
# from drifting silently. Lint is intentionally omitted — the repo has no
# committed ESLint config yet, so `next lint` would prompt interactively.
on:
  push:
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
