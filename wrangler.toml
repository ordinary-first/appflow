# Glim — Cloudflare Workers configuration
name = "glim"
main = ".open-next/worker.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# --- D1 (SQLite) ---
# Create with: wrangler d1 create glim-db
# Then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "glim-db"
database_id = "beb01748-803c-4236-a343-e2b8a92e266f"
migrations_dir = "drizzle"

# --- R2 (demo videos / thumbnails) ---
# Create with: wrangler r2 bucket create glim-media
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "glim-media"

# --- Rate limiting (GA binding) ---
# IP-keyed write-route limiter: 60 requests / 60s. Absent locally (no-op).
[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[vars]
# Public base URL of the app (used by better-auth). Override per environment.
BETTER_AUTH_URL = "https://glim.ordinaryindividuality.workers.dev"
# Production predicate for fail-closed checks (auth secret, rate limiting).
# Local dev overrides this in .dev.vars with ENVIRONMENT="development".
ENVIRONMENT = "production"
